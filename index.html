<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCQ Quiz</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#667085;--line:#d9deea;--accent:#4f46e5;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2133;--text:#eef1f8;--muted:#9aa4bb;--line:#2c3550;--accent:#818cf8;--okbg:#12361f;--badbg:#3b1717}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2133;--text:#eef1f8;--muted:#9aa4bb;--line:#2c3550;--accent:#818cf8;--okbg:#12361f;--badbg:#3b1717}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:680px}
h1{font-size:1.4rem;margin:8px 0 14px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.q{font-size:1.2rem;line-height:1.5;margin:0 0 16px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin:10px 0;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font-size:1rem;cursor:pointer;transition:transform .1s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.msg{min-height:1.6em;margin:10px 0 0;font-weight:600}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-size:1rem;cursor:pointer;margin-top:12px}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.center{text-align:center}
.big{font-size:3rem;margin:6px 0}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
textarea{width:100%;min-height:140px;margin:10px 0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:.9rem}
label{display:block;margin:8px 0;font-size:.9rem;color:var(--muted)}
small{color:var(--muted)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.sad{position:fixed;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(40deg)}}
.pop{position:fixed;left:50%;top:40%;font-size:6rem;z-index:61;pointer-events:none;transform:translate(-50%,-50%);animation:pop 1.2s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
</style>
</head>

const $=id=>document.getElementById(id);
let i=0,score=0,locked=false,actx;

function synth(kind){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    const notes=kind==='right'?[523,659,784,1047]:[330,262,208,165];
    notes.forEach((f,k)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=kind==='right'?'triangle':'sawtooth';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+k*.13);g.gain.linearRampToValueAtTime(.25,t+k*.13+.02);g.gain.exponentialRampToValueAtTime(.001,t+k*.13+.25);
      o.connect(g);g.connect(actx.destination);o.start(t+k*.13);o.stop(t+k*.13+.3);
    });
  }catch(e){}
}
function play(kind){
  if(SOUNDS[kind]){const a=new Audio(SOUNDS[kind]);a.play().catch(()=>synth(kind));}else synth(kind);
}

// confetti
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(){
  const cols=['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7','#eab308'];
  for(let n=0;n<160;n++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,s:Math.random()*8+4,c:cols[n%6],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:140});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l--;
    cx.save();cx.globalAlpha=Math.min(1,p.l/40);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):null;
  if(!parts.length)cx.clearRect(0,0,cv.width,cv.height);
}
// sad emoji
function sad(){
  const p=document.createElement('div');p.className='pop';p.textContent='😢';document.body.appendChild(p);setTimeout(()=>p.remove(),1300);
  for(let n=0;n<14;n++){
    const e=document.createElement('div');e.className='sad';e.textContent=['😢','😞','😭','☹️'][n%4];
    e.style.left=Math.random()*95+'vw';e.style.fontSize=(1.5+Math.random()*1.8)+'rem';
    e.style.animationDuration=(1.8+Math.random()*1.5)+'s';e.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),4200);
  }
}

function render(){
  const box=$('box');box.innerHTML='';locked=false;
  if(i>=QUESTIONS.length){
    const pct=Math.round(score/QUESTIONS.length*100);
    box.className='card center';
    box.innerHTML=`<div class="big">${pct>=60?'🏆':'💪'}</div><h2>Quiz complete!</h2><p>Score: <b>${score} / ${QUESTIONS.length}</b> (${pct}%)</p><button class="btn" id="again">Try again</button>`;
    $('again').onclick=()=>{i=0;score=0;render()};
    if(pct>=60)confetti();
    return;
  }
  box.className='card';
  const d=QUESTIONS[i];
  box.innerHTML=`<div class="top"><span>Question ${i+1} of ${QUESTIONS.length}</span><span>Score: ${score}</span></div><div class="bar"><i style="width:${i/QUESTIONS.length*100}%"></i></div><p class="q"></p><div id="opts"></div><div class="msg" id="msg"></div><div id="nx"></div>`;
  box.querySelector('.q').textContent=d.q;
  d.o.forEach((t,k)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+k)+'. '+t;
    b.onclick=()=>answer(k);$('opts').appendChild(b);
  });
}
function answer(k){
  if(locked)return;locked=true;
  const d=QUESTIONS[i],bs=[...document.querySelectorAll('.opt')];
  bs.forEach(b=>b.disabled=true);
  bs[d.a].classList.add('right');
  if(k===d.a){score++;$('msg').textContent='✅ Sahi jawab! Well done!';$('msg').style.color='var(--ok)';play('right');confetti();}
  else{bs[k].classList.add('wrong');$('msg').textContent='❌ Galat jawab. Sahi answer: '+String.fromCharCode(65+d.a);$('msg').style.color='var(--bad)';play('wrong');sad();}
  const n=document.createElement('button');n.className='btn';n.textContent=i+1<QUESTIONS.length?'Next ➜':'See result';
  n.onclick=()=>{i++;render()};$('nx').appendChild(n);
}

// teacher setup
function toText(){return QUESTIONS.map(d=>[d.q,...d.o,String.fromCharCode(65+d.a)].join(' | ')).join('\n')}
$('mcqText').value=toText();
$('apply').onclick=()=>{
  const out=[],skipped=[];let total=0;
  $('mcqText').value.split('\n').forEach((line,n)=>{
    if(!line.trim())return;total++;
    line=line.replace(/^\s*(q?\s*\d+\s*[.):-]\s*)/i,'');
    const p=line.split(/\||\t/).map(s=>s.trim());
    const ans=(p.pop()||'').replace(/ans(wer)?|[\s:().\-]/gi,'').toUpperCase();
    const a=ans.length===1?ans.charCodeAt(0)-65:-1,q=p.shift();
    const o=p.map(t=>t.replace(/^\(?[A-F][.)]\s+/i,''));
    if(q&&o.length>=2&&a>=0&&a<o.length)out.push({q,o,a});else skipped.push(n+1);
  });
  if(out.length)QUESTIONS=out;
  $('status').textContent=out.length+' of '+total+' questions loaded.'+(skipped.length?' Skipped line numbers: '+skipped.join(', ')+' (check format: Question | A | B | C | D | Correct letter).':'');
  i=0;score=0;render();
};
$('copyBtn').onclick=()=>{
  const t=toText();$('mcqText').value=t;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('status').textContent='MCQs copied to clipboard.').catch(()=>{$('mcqText').select();$('status').textContent='Select-all done: press Ctrl+C to copy.'});
};
$('sndRight').onchange=e=>{if(e.target.files[0])SOUNDS.right=URL.createObjectURL(e.target.files[0])};
$('sndWrong').onchange=e=>{if(e.target.files[0])SOUNDS.wrong=URL.createObjectURL(e.target.files[0])};
render();
</script>
